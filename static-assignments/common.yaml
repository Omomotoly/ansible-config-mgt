- name: Update web and NFS servers
  hosts: webservers, nfs
  become: yes

  tasks:
    - name: Ensure Wireshark is installed
      ansible.builtin.package:
        name: wireshark
        state: present

    - name: Ensure /opt/app directory exists
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Ensure config file exists
      ansible.builtin.file:
        path: /opt/app/config.txt
        state: touch
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Set system timezone to UTC
      community.general.timezone:
        name: UTC

    - name: Ensure deployment script exists
      ansible.builtin.copy:
        dest: /home/ubuntu/scripts/deploy.sh
        content: |
          #!/bin/bash
          echo "Deploy script executed successfully!"
        mode: '0755'
      notify: Run deployment script

  handlers:
    - name: Run deployment script
      ansible.builtin.command:
        cmd: /home/ubuntu/scripts/deploy.sh


- name: Update LB and DB servers
  hosts: lb, db
  become: yes

  tasks:
    - name: Update package cache on Debian/Ubuntu
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Wireshark is installed
      ansible.builtin.package:
        name: wireshark
        state: present
