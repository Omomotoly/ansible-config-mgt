mysql_root_password: "{{ vault_mysql_root_password }}"
mysql_databases:
  - name: tooling
    encoding: latin1
    collation: latin1_general_ci
mysql_users:
  - name: webaccess
    host: 172.31.%
    plugin: caching_sha2_password
    plugin_auth_string: "{{ vault_mysql_user_password }}"
    priv: "tooling.*:ALL"
